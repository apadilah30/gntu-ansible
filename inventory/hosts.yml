# Single-server inventory.
# Everything (FE, BE, websocket, and the monitoring stack) runs on one Ubuntu host.
# Replace ansible_host / ansible_user / key path with your server's real values.
all:
  hosts:
    gntu-prod:
      ansible_host: 182.23.45.55        # <-- change to your server IP/DNS
      ansible_user: ubuntu              # <-- change to your SSH user
      ansible_ssh_private_key_file: ~/.ssh/id_rsa   # <-- change if needed
  children:
    frontend:
      hosts:
        gntu-prod:
    backend:
      hosts:
        gntu-prod:
    websocket:
      hosts:
        gntu-prod:
    monitoring:
      hosts:
        gntu-prod:
