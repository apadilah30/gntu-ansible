---
# FrankenPHP (Laravel Octane worker mode) runtime - faster, persistent workers.
# Prerequisite: apply the Http:: timeout + Redis session fixes first (README 5.4).
- name: Ensure laravel/octane + frankenphp are available (composer)
  ansible.builtin.command:
    cmd: composer require laravel/octane --no-interaction
    chdir: "{{ frontend_dir }}"
  become_user: "{{ deploy_user }}"
  register: octane_require
  changed_when: "'Nothing to install' not in octane_require.stdout"

- name: Install FrankenPHP binary via octane
  ansible.builtin.command:
    cmd: php artisan octane:install --server=frankenphp --no-interaction
    chdir: "{{ frontend_dir }}"
    creates: "{{ frontend_dir }}/frankenphp"
  become_user: "{{ deploy_user }}"

- name: Ensure writable FrankenPHP config+data dirs (avoids Caddy autosave warnings)
  ansible.builtin.file:
    path: "{{ frankenphp_data_dir }}/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0775"
  loop:
    - config
    - data

- name: Deploy Octane/FrankenPHP systemd unit
  ansible.builtin.template:
    src: frankenphp.service.j2
    dest: /etc/systemd/system/gntu-cms-octane.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and (re)start FrankenPHP
  ansible.builtin.systemd:
    name: gntu-cms-octane.service
    enabled: true
    state: restarted

# Switch nginx from PHP-FPM (fastcgi_pass) to a reverse proxy in front of FrankenPHP.
- name: Deploy nginx reverse-proxy vhost for FrankenPHP
  ansible.builtin.template:
    src: nginx-frankenphp.conf.j2
    dest: /etc/nginx/sites-available/gntu-cms.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable the FrankenPHP vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/gntu-cms.conf
    dest: /etc/nginx/sites-enabled/gntu-cms.conf
    state: link
  notify: reload nginx

- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Optionally disable PHP-FPM (no longer used by FE)
  ansible.builtin.systemd:
    name: "php{{ php_version }}-fpm"
    state: stopped
    enabled: false
  when: frankenphp_disable_fpm | default(false) | bool
