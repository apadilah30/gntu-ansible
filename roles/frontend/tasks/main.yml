---
# FE runs as: nginx (serves /var/www/gntu-cms/public) -> PHP-FPM 8.3 (unix socket).
# There is NO Octane service.
- name: Install PHP {{ php_version }} (FPM) and extensions
  ansible.builtin.apt:
    name:
      - "php{{ php_version }}-fpm"
      - "php{{ php_version }}-cli"
      - "php{{ php_version }}-common"
      - "php{{ php_version }}-pgsql"
      - "php{{ php_version }}-redis"
      - "php{{ php_version }}-mbstring"
      - "php{{ php_version }}-xml"
      - "php{{ php_version }}-curl"
      - "php{{ php_version }}-gd"
      - "php{{ php_version }}-zip"
      - "php{{ php_version }}-bcmath"
      - unzip
    state: present
    update_cache: true

- name: Install Composer
  ansible.builtin.get_url:
    url: https://getcomposer.org/installer
    dest: /tmp/composer-setup.php
    mode: "0644"

- name: Run Composer installer
  ansible.builtin.command:
    cmd: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
    creates: /usr/local/bin/composer

- name: Install Node.js {{ node_version }}
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
    apt-get install -y nodejs
  args:
    creates: /usr/bin/node

- name: Ensure frontend dir exists
  ansible.builtin.file:
    path: "{{ frontend_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"

- name: Checkout frontend repo
  ansible.builtin.git:
    repo: "{{ frontend_repo }}"
    dest: "{{ frontend_dir }}"
    version: "{{ frontend_branch }}"
    update: true
  become_user: "{{ deploy_user }}"
  register: frontend_git

- name: composer install (no-dev, optimized)
  ansible.builtin.command:
    cmd: composer install --no-dev --optimize-autoloader --no-interaction
    chdir: "{{ frontend_dir }}"
  become_user: "{{ deploy_user }}"
  when: frontend_git.changed

- name: npm ci + build (assets end up in public/build)
  ansible.builtin.shell: |
    npm ci
    npm run build
  args:
    chdir: "{{ frontend_dir }}"
  become_user: "{{ deploy_user }}"
  when: frontend_git.changed

- name: Laravel migrate + optimize caches
  ansible.builtin.command:
    cmd: "php artisan {{ item }}"
    chdir: "{{ frontend_dir }}"
  become_user: "{{ deploy_user }}"
  loop:
    - migrate --force
    - config:cache
    - route:cache
    - view:cache
  when: frontend_git.changed

- name: Ensure storage + cache are writable by php-fpm
  ansible.builtin.file:
    path: "{{ frontend_dir }}/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0775"
    recurse: true
  loop:
    - storage
    - bootstrap/cache

# ---- Runtime-specific setup (fpm | frankenphp) ----
- name: Configure PHP-FPM runtime
  ansible.builtin.include_tasks: runtime_fpm.yml
  when: frontend_runtime == "fpm"

- name: Configure FrankenPHP (Octane) runtime
  ansible.builtin.include_tasks: runtime_frankenphp.yml
  when: frontend_runtime == "frankenphp"

# --- 504 root-cause reminder (informational; we don't rewrite your .env automatically) ---
- name: Show 504 mitigation checklist (PHP-FPM model)
  when: frontend_runtime == "fpm"
  ansible.builtin.debug:
    msg:
      - "504 tanpa jejak di backend = child PHP-FPM habis menunggu panggilan Http:: yang lambat."
      - "1) Turunkan SEMUA Http:: ke backend jadi ->timeout(8)->connectTimeout(3) (ada yang 120s/tanpa timeout)."
      - "2) Pindah SESSION_DRIVER & CACHE_STORE ke redis (sekarang 'database' -> lock di PostgreSQL)."
      - "3) Turunkan nginx 'fastcgi_read_timeout 300s' menjadi ~30-60s agar request macet cepat gagal, tidak menyandera worker."
      - "4) Tune pm.max_children di pool (lihat metrik php-fpm 'active/max children' & 'listen queue' di Grafana)."
      - "Setelah ubah .env: cd {{ frontend_dir }} && php artisan config:cache && systemctl reload php{{ php_version }}-fpm"
