---
- name: Download Alertmanager
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64"

- name: Install Alertmanager binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/alertmanager"
    dest: /opt/monitoring/bin/alertmanager
    remote_src: true
    mode: "0755"
    owner: monitoring
    group: monitoring

- name: Deploy alertmanager.yml (Telegram)
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: monitoring
    group: monitoring
    mode: "0640"
  notify: restart alertmanager

- name: Alertmanager service
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    mode: "0644"
  notify: reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start Alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    enabled: true
    state: started
